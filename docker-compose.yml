services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: muchtodo-backend

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ./.env:/app/.env:ro

    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - muchtodo-network

  mongodb:
    image: mongo:7.0

    container_name: muchtodo-mongodb

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - mongodb://localhost:27017/admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    networks:
      - muchtodo-network

volumes:
  mongodb_data:

networks:
  muchtodo-network:
    driver: bridge
